name: Build & Publish Android APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/eagle-study-android/**'
      - 'hosting/**'
      - 'firebase.json'
      - '.github/workflows/deploy-apk.yml'
  workflow_dispatch:

permissions:
  contents: write        # create/update the "latest" GitHub Release
  checks: write          # used by action-hosting-deploy
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # `secrets` can't be used in step `if:` conditions, so expose presence via env.
    env:
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    defaults:
      run:
        working-directory: apps/eagle-study-android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze & test
        run: flutter analyze && flutter test

      # build.gradle.kts requires android/key.properties, so signing secrets are mandatory.
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret (and its password/alias secrets)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/eagle-study-release.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=eagle-study-release.jks\n" \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Publish Android APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: EAGLE STUDY Android APK
          files: apps/eagle-study-android/build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
          make_latest: true

      # Firebase Hosting only accepts .apk files on the Blaze plan.
      - name: Stage APK for Firebase Hosting
        if: env.HAS_FIREBASE == 'true'
        working-directory: .
        run: cp apps/eagle-study-android/build/app/outputs/flutter-apk/app-release.apk hosting/public/eagle-study.apk

      - name: Deploy to Firebase Hosting
        if: env.HAS_FIREBASE == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: eagle-23b0f
          channelId: live
